# D-LinkNet Road Extraction — Default Configuration
# Edit paths and hyperparameters to suit your dataset.

# ─── Data ──────────────────────────────────────────────────────────────────────
data:
  train_images:  "data/processed/train/images"
  train_masks:   "data/processed/train/masks"
  val_images:    "data/processed/val/images"
  val_masks:     "data/processed/val/masks"
  image_size:    512          # must be divisible by 32 (encoder strides)

# ─── Model ─────────────────────────────────────────────────────────────────────
model:
  backbone:      "resnet50"   # resnet50 recommended; resnet34 for lighter model
  pretrained:    true         # always true — ImageNet weights crucial for convergence

# ─── Loss ──────────────────────────────────────────────────────────────────────
# Updated recipe for "roads missed entirely" + "roads broken/discontinuous":
#   - Focal-Tversky (beta > alpha) biases the model toward catching every road
#     pixel — raises recall, directly fixes "not recognizing the road".
#   - Connectivity loss penalises broken/disconnected predictions directly.
loss:
  bce_w:          0.25
  tversky_w:      0.55
  focal_w:        0.20
  connectivity_w: 0.15        # set 0 to disable; raise to 0.25-0.3 if roads still broken
  tversky_alpha:  0.3         # FP weight — lower tolerates slightly thicker roads
  tversky_beta:   0.7         # FN weight — higher punishes missed roads harder
  tversky_gamma:  1.33        # focuses loss on hardest/most ambiguous pixels
  focal_alpha:    0.8         # weight on positive (road) class
  focal_gamma:    2.0
  use_connectivity: true

# ─── Training ──────────────────────────────────────────────────────────────────
training:
  epochs:        100
  batch_size:    8            # 8 fits 2048-ch ResNet50 on 16GB GPU
                              # reduce to 4 on 8GB GPU
  num_workers:   4

  # Two-group LR: encoder trained slower to preserve ImageNet features
  encoder_lr:    1.0e-4
  decoder_lr:    1.0e-3       # 10× higher for new decoder weights
  weight_decay:  1.0e-4

  # Checkpointing
  checkpoint_dir: "outputs/checkpoints"
  resume:         false       # set true to continue from best_model.pth

  # Early stopping
  early_stopping_patience: 15

# ─── Inference ─────────────────────────────────────────────────────────────────
inference:
  threshold:     0.5          # probability threshold; tune with find_best_threshold()
  tta:           true         # Test-Time Augmentation (slower but better)
  tile:          true         # tiled inference for full-res satellite images
  tile_overlap:  64           # pixels; increase for smoother blending
  clean_mask:    true         # apply morphological post-processing
